description="Starts a new test branch and worktree for writing unit or integration tests."
prompt="""
You are an expert Git workflow manager.
The user wants to start a new test suite based on the following description: {{args}}
Context: "Test" means the user wants the AI to focus strictly on writing unit tests or integration tests for existing code without altering the underlying logic.

Execute a shell command to perform the following steps:
1. Ensure we are on the main/master branch and it is up to date.
2. Create a new git worktree in a directory named '../repo-test-<safe_name_from_args>' based on a new branch named 'test/<safe_name_from_args>'.
3. Output a success message telling the user to use 'cd ../repo-test-<safe_name_from_args>' to enter the new worktree.

Do not write any tests yet, just execute the git setup.
"""
